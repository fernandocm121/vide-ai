name: Security

# Camada determinística do quality gate de segurança: mesmas entradas, mesmo
# resultado. Cada job reprova só o que a PR introduz, não a dívida que já existia.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lista os commits da PR pela API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Em PR, varre só os commits da PR; em push, os commits do push.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentar exige token de escrita, que PRs de fork não têm; o
          # resultado aparece no check e no resumo do job.
          GITLEAKS_ENABLE_COMMENTS: false

  sast:
    name: sast · semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # --baseline-commit faz o Semgrep reportar só achados novos em relação
      # à base da PR (ou ao commit anterior ao push). `.semgrep/` tem regras
      # do projeto que ensinam ao Semgrep que getQuery/readBody/... do h3 são
      # entrada do usuário (as regras públicas não sabem disso).
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -- --metrics=off --error \
            --config p/javascript --config p/typescript --config p/nodejs \
            --config p/owasp-top-ten --config p/secrets --config p/github-actions \
            --config .semgrep/
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            set -- "$@" --baseline-commit "$BASE_SHA"
          fi
          semgrep scan "$@"

  dependencies:
    name: deps · dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Compara o grafo de dependências da base com o da PR e reprova se a PR
      # introduz um pacote com vulnerabilidade conhecida de severidade alta ou
      # crítica. Vulnerabilidades que já estavam na base não reprovam.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
